name: CI

on:
  push:
    branches: [main, lima]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate the contract (shape, naming, references, value consistency, intent levels)
        run: npm run validate

      - name: Tests
        run: npm test
